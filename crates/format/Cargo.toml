[package]
name = "vectorcraft-format"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VectorCraft native .vectorcraft format (versioned JSON, embedded images)"

[lints]
workspace = true

[dependencies]
vectorcraft-doc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
flate2 = { workspace = true }

# A plain fsync where a volume refuses the full flush (`sync_file`, atomic.rs). Already in
# Cargo.lock (tempfile), so this adds no new crate.
[target.'cfg(target_vendor = "apple")'.dependencies]
rustix = { workspace = true, features = ["std", "fs"] }

[dev-dependencies]
vectorcraft-testkit = { workspace = true }
proptest = { workspace = true }
vectorcraft-geom = { workspace = true }
